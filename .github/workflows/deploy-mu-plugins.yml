name: Deploy MU Plugins

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mu-plugins.yml"
      - "mu-plugins/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate PHP syntax
        run: find mu-plugins -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate SFTP secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        run: |
          missing=()
          for var in SFTP_HOST SFTP_PORT SFTP_USERNAME SFTP_PASSWORD SFTP_TARGET; do
            val="${!var}"
            if [ -z "$val" ]; then missing+=("$var"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Chybajuce GitHub Secrets: ${missing[*]}"
            echo "Nastav ich v GitHub > Settings > Secrets and variables > Actions a spusti deploy znovu."
            exit 1
          fi
          echo "OK: SFTP_HOST=${SFTP_HOST} SFTP_PORT=${SFTP_PORT} SFTP_TARGET=${SFTP_TARGET}"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Test SFTP/FTP connectivity (TCP)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org || echo 'nezistene')
          echo "Runner public IP: ${RUNNER_IP}"
          curl -s --max-time 10 "http://ip-api.com/json/${RUNNER_IP}" | python3 -c "import sys,json;d=json.load(sys.stdin);print('Krajina runnera:', d.get('status'), d.get('countryCode'), '-', d.get('country'), '-', d.get('city'))" 2>/dev/null || echo 'geo lookup zlyhal'
          echo "Povolene krajiny hostingu: SK, CZ, HU, USA, DE, IE"
          IP=$(getent hosts "${SFTP_HOST}" | awk '{print $1}' | head -1)
          echo "DNS: ${SFTP_HOST} -> ${IP}"
          for port in 22 21 2222; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/${SFTP_HOST}/${port}" 2>/dev/null; then
              echo "PORT ${port}: OTVORENY"
            else
              echo "PORT ${port}: nedostupny / odfiltrovany"
            fi
          done
          echo "Nastaveny SFTP_PORT secret: ${SFTP_PORT}"
          if timeout 15 bash -c "exec 3<>/dev/tcp/${SFTP_HOST}/${SFTP_PORT}" 2>/dev/null; then
            echo "OK: nastaveny port ${SFTP_PORT} je z runnera dostupny"
          else
            echo "::error::Nastaveny port ${SFTP_PORT} nie je z GitHub runnera dostupny. S najvacsou pravdepodobnostou geo-blokacia hostingu blokuje krajinu runnera."
            exit 1
          fi

      - name: Upload MU plugins to WordPress via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        run: |
          echo "Prihlasujem sa na sftp://${SFTP_HOST}:${SFTP_PORT}"
          echo "Cielova cesta: ${SFTP_TARGET}"
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" sftp://"$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 2
          lcd mu-plugins
          mirror -R --only-newer --verbose ./ "$SFTP_TARGET"
          bye
          EOF
